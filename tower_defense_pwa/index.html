<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>タワーディフェンス - 無限タイムラインモード</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: var(--text);
      padding: 12px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #top {
      display: grid;
      grid-template-columns: repeat(2, 1fr) auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stats-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .cb {
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .cb span { color: #fbbf24; margin-left: 4px; }

    #wtb {
      grid-column: span 3;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    #eg {
      grid-column: span 3;
      background: var(--panel);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    #eg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    #eg-lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; }
    #eg-txt { font-size: 11px; font-weight: 700; }

    #eg-track {
      height: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    #eg-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-red), #f87171);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      transition: width 0.3s ease;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      margin: 0 auto;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    canvas {
      display: block;
      border-radius: 12px;
      border: 2px solid #334155;
      width: 100%;
      height: auto;
      background: #1c1917;
    }

    #bottom {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .bs {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      color: white;
      transition: all 0.2s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .bs:active { transform: translateY(2px); box-shadow: none; }
    .bs:disabled { opacity: 0.4; filter: grayscale(1); }

    #bn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    #brr { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .cl { font-size: 10px; opacity: 0.8; font-weight: 400; }

    #ep {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .eb {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .eb:disabled { opacity: 0.3; }

    .eb-label { font-size: 10px; font-weight: 700; color: var(--text-dim); }
    .elv { font-size: 16px; font-weight: 900; }
    .eco { font-size: 10px; color: #fbbf24; font-weight: 600; }

    #ui {
      background: var(--panel);
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    #tap-menu {
      display: none;
      position: fixed;
      z-index: 300;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 10px;
      gap: 8px;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      min-width: 150px;
    }

    #tap-menu.show { display: flex; animation: pop 0.2s ease-out; }
    @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .tap-menu-btn { padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    #tmb-evolve { background: #f59e0b; color: #78350f; }
    #tmb-sell { background: #fee2e2; color: #b91c1c; }
    #tmb-cancel { background: #334155; color: #cbd5e1; }
  </style>
</head>

<body>

  <div id="tap-menu">
    <div class="tap-menu-title" id="tmb-title" style="text-align:center; padding-bottom:8px; border-bottom:1px solid #334155;">キャラ操作</div>
    <button class="tap-menu-btn" id="tmb-evolve" style="display:none">✨ 進化する</button>
    <button class="tap-menu-btn" id="tmb-sell">💰 売却</button>
    <button class="tap-menu-btn" id="tmb-cancel">✕ 戻る</button>
  </div>

  <div id="top">
    <div class="stats-group">
      <div class="cb">💰 <span id="sc">200</span></div>
      <div class="cb">🔮 <span id="sp">3</span></div>
    </div>
    <div class="stats-group">
      <div class="cb">WAVE <span id="sw">1</span></div>
      <div class="cb">SCORE <span id="ss">0</span></div>
    </div>
    <div id="wtb"><span id="wt-lbl">START!</span></div>

    <div id="eg">
      <div id="eg-header">
        <div id="eg-lbl">道にいる敵の数</div>
        <div id="eg-txt"><span id="se">0</span> / 100</div>
      </div>
      <div id="eg-track">
        <div id="eg-fill"></div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="c" width="540" height="360"></canvas>
    <div id="mo" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(15,23,42,0.95);color:white;padding:30px;border-radius:20px;
    font-size:20px;font-weight:900;text-align:center;line-height:1.6;
    border:2px solid var(--accent-blue);box-shadow:0 0 30px rgba(59,130,246,0.5);white-space:nowrap;z-index:200;"></div>
  </div>

  <div id="bottom">
    <div class="action-row">
      <button class="bs" id="bn">
        <span>🎲 召喚</span>
        <span class="cl">💰 50</span>
      </button>
      <button class="bs" id="brr">
        <span>✨ お祈り</span>
        <span class="cl">🔮 1個</span>
      </button>
    </div>

    <div id="ep">
      <button class="eb" id="enn" style="border-top: 3px solid var(--accent-green);">
        <span class="eb-label">N-LEVEL</span>
        <span class="elv" id="enlv">Lv0</span>
        <span class="eco" id="enco">💰80</span>
      </button>
      <button class="eb" id="err" style="border-top: 3px solid var(--accent-blue);">
        <span class="eb-label">R-LEVEL</span>
        <span class="elv" id="erlv">Lv0</span>
        <span class="eco" id="erco">💰150</span>
      </button>
      <button class="eb" id="esr" style="border-top: 3px solid var(--accent-purple);">
        <span class="eb-label">SR-LEVEL</span>
        <span class="elv" id="esrlv">Lv0</span>
        <span class="eco" id="esrco">💰280</span>
      </button>
    </div>

    <div id="ui">
      <div>👾 配置数: <span id="suu">0</span> / 24</div>
      <div>💡 15秒ごとにWaveが自動で重なっていきます！</div>
    </div>
  </div>

  <script>
    (function () {
      const cv = document.getElementById('c');
      const ctx = cv.getContext('2d');
      const CW = cv.width, CH = cv.height;

      const CELL = 30;
      const FC = Math.floor(CW / CELL);
      const FR = Math.floor(CH / CELL);
      const RW = 2;
      const GX1 = RW * CELL, GY1 = RW * CELL;
      const GX2 = CW - RW * CELL, GY2 = CH - RW * CELL;
      const GW = GX2 - GX1, GH = GY2 - GY1;
      const SCOLS = 6, SROWS = 4;
      const SW_ = GW / SCOLS, SH_ = GH / SROWS;

      function spos(i) { return { x: GX1 + (i % SCOLS) * SW_ + SW_ / 2, y: GY1 + Math.floor(i / SCOLS) * SH_ + SH_ / 2 }; }
      function buildRing(o) {
        const pts = [];
        const c1 = o, c2 = FC - 1 - o, r1 = o, r2 = FR - 1 - o;
        for (let c = c1; c <= c2; c++) pts.push([c, r1]);
        for (let r = r1 + 1; r <= r2; r++) pts.push([c2, r]);
        for (let c = c2 - 1; c >= c1; c--) pts.push([c, r2]);
        for (let r = r2 - 1; r >= r1 + 1; r--) pts.push([c1, r]);
        return pts;
      }
      const FULL = buildRing(1);
      const si = Math.max(0, FULL.findIndex(([c, r]) => c === 1 && r === FR - 2));
      const PATH = [...FULL.slice(si), ...FULL.slice(0, si)];
      const PL = PATH.length;
      const SPX = PATH[0][0] * CELL + CELL / 2;
      const SPY = PATH[0][1] * CELL + CELL / 2;

      const FPS = 60;
      const WAVE_INTERVAL_SEC = 15;

      const RRC = { n: '#4ade80', r: '#60a5fa', sr: '#c084fc' };
      const EL = { n: 0, r: 0, sr: 0 };
      function emul(rr) { return 1 + EL[rr] * 0.1; }
      function ecost(rr) {
        const b = { n: 80, r: 150, sr: 280 }[rr], m = { n: 1.4, r: 1.5, sr: 1.6 }[rr];
        return Math.floor(b * Math.pow(m, EL[rr]));
      }

      const CN = [
        { icon: '⚔️', color: '#60a5fa', radius: 65, baseDamage: 22, rate: 48, rarity: 'n' },
        { icon: '🏹', color: '#4ade80', radius: 85, baseDamage: 14, rate: 40, rarity: 'n' },
        { icon: '🧙', color: '#c084fc', radius: 70, baseDamage: 30, rate: 80, special: 'splash', rarity: 'n' },
        { icon: '💊', color: '#34d399', radius: 62, baseDamage: 10, rate: 36, special: 'slow', rarity: 'n' },
      ];
      const CR = [
        { icon: '🛡️', color: '#60a5fa', radius: 75, baseDamage: 38, rate: 55, rarity: 'r' },
        { icon: '🎯', color: '#4ade80', radius: 95, baseDamage: 28, rate: 38, rarity: 'r' },
        { icon: '🧝', color: '#c084fc', radius: 80, baseDamage: 50, rate: 75, special: 'splash', rarity: 'r' },
        { icon: '📿', color: '#34d399', radius: 72, baseDamage: 20, rate: 32, special: 'slow', rarity: 'r' },
      ];
      const CSR = [
        { icon: '🐉', color: '#f87171', radius: 110, baseDamage: 70, rate: 62, special: 'splash', rarity: 'sr' },
        { icon: '👼', color: '#fbbf24', radius: 100, baseDamage: 34, rate: 20, special: 'chain', rarity: 'sr' },
        { icon: '🥷', color: '#d1d5db', radius: 75, baseDamage: 24, rate: 12, rarity: 'sr' },
        { icon: '🔮', color: '#a78bfa', radius: 125, baseDamage: 50, rate: 65, special: 'splash', rarity: 'sr' },
      ];
      const PN = [...CN, ...CN, ...CN, ...CR];
      const PP = [...CR, ...CR, ...CSR];

      let coins = 200, pray = 3, score = 0, wave = 1;
      let units = [], enemies = [], bullets = [], particles = [];
      let globalTick = 0, spawnTick = 0;
      let gameOver = false;

      const $ = id => document.getElementById(id);

      function updateUI() {
        $('sc').textContent = coins; $('sp').textContent = pray;
        $('sw').textContent = wave; $('ss').textContent = score;
        $('suu').textContent = units.length;
        const n = enemies.length; $('se').textContent = n;
        $('eg-fill').style.width = Math.min(n, 100) + '%';
        $('eg-fill').style.background = n >= 80 ? '#ef4444' : n >= 50 ? '#f59e0b' : '#10b981';
        
        const nextWaveIn = WAVE_INTERVAL_SEC - Math.floor((globalTick % (WAVE_INTERVAL_SEC * FPS)) / FPS);
        $('wt-lbl').textContent = `NEXT WAVE IN ${nextWaveIn}s`;
        $('wtb').style.background = 'rgba(59, 130, 246, 0.2)';

        ['n', 'r', 'sr'].forEach(r => {
          const prefix = r === 'n' ? 'en' : (r === 'r' ? 'er' : 'esr');
          $(prefix + 'lv').textContent = 'Lv' + EL[r];
          $(prefix + 'co').textContent = '💰' + ecost(r);
        });
      }

      function summon(pool) {
        if (units.length >= 24) return;
        const ch = { ...pool[Math.floor(Math.random() * pool.length)] };
        ch.stackId = ch.icon;
        const stackable = units.find(u => u.stackId === ch.stackId && u.rarity === ch.rarity && (u.stack || 1) < 3);
        if (stackable) { stackable.stack = (stackable.stack || 1) + 1; return; }
        const used = new Set(units.map(u => u.slotIdx));
        let s = -1; for (let i = 0; i < 24; i++) if (!used.has(i)) { s = i; break; }
        if (s < 0) return;
        const p = spos(s);
        units.push({ ...ch, slotIdx: s, cx: p.x, cy: p.y, cd: 0, stack: 1 });
      }

      $('bn').onclick = () => { if (coins >= 50) { coins -= 50; summon(PN); } };
      $('brr').onclick = () => { if (pray >= 1) { pray--; summon(PP); } };
      $('enn').onclick = () => { const c = ecost('n'); if(coins>=c){ coins-=c; EL.n++; } };
      $('err').onclick = () => { const c = ecost('r'); if(coins>=c){ coins-=c; EL.r++; } };
      $('esr').onclick = () => { const c = ecost('sr'); if(coins>=c){ coins-=c; EL.sr++; } };

      const EVOLVE_NEXT = { n: () => CR, r: () => CSR };
      function doEvolve(u) {
        const pool = EVOLVE_NEXT[u.rarity]();
        const ev = { ...pool[Math.floor(Math.random() * pool.length)] };
        Object.assign(u, ev); u.stackId = u.icon; u.stack = 1;
      }

      const tapMenu = $('tap-menu');
      let tapTarget = null;
      function showTapMenu(u, cx, cy) {
        tapTarget = u;
        $('tmb-title').textContent = u.icon + (u.stack > 1 ? ' x' + u.stack : '');
        $('tmb-evolve').style.display = (u.stack >= 3 && EVOLVE_NEXT[u.rarity]) ? '' : 'none';
        tapMenu.style.left = Math.min(cx, window.innerWidth - 160) + 'px';
        tapMenu.style.top = Math.min(cy, window.innerHeight - 150) + 'px';
        tapMenu.classList.add('show');
      }
      $('tmb-evolve').onclick = () => { if(tapTarget) { doEvolve(tapTarget); updateUI(); } tapMenu.classList.remove('show'); };
      $('tmb-sell').onclick = () => { if(tapTarget) { units = units.filter(u => u !== tapTarget); updateUI(); } tapMenu.classList.remove('show'); };
      $('tmb-cancel').onclick = () => tapMenu.classList.remove('show');

      cv.addEventListener('mousedown', e => {
        const r=cv.getBoundingClientRect();
        const x = (e.clientX-r.left)*(CW/r.width), y = (e.clientY-r.top)*(CH/r.height);
        const u = units.find(u => Math.hypot(u.cx-x, u.cy-y) < 20);
        if(u) showTapMenu(u, e.clientX, e.clientY);
        else tapMenu.classList.remove('show');
      });

      function spawnE() {
        const hp = 60 + wave * 45, spd = 0.6 + wave * 0.05;
        enemies.push({ hp, maxHp: hp, spd, x: SPX, y: SPY, pathIdx: 0, reward: 8+wave*2, slowed: 0 });
      }

      function loop() {
        if (gameOver) return;
        globalTick++;
        
        if (globalTick % (WAVE_INTERVAL_SEC * FPS) === 0) {
          wave++;
          coins += 30 + wave * 5;
          if(wave % 3 === 0) pray++;
        }

        const interval = Math.max(10, 60 - wave * 2);
        if (globalTick % interval === 0) spawnE();

        enemies.forEach(en => {
          const ni = (en.pathIdx + 1) % PL;
          const [tc, tr] = PATH[ni];
          const tx = tc * CELL + CELL / 2, ty = tr * CELL + CELL / 2;
          const dx = tx - en.x, dy = ty - en.y, dist = Math.hypot(dx, dy);
          const s = en.slowed > 0 ? en.spd * 0.4 : en.spd;
          if (dist < s) { en.x = tx; en.y = ty; en.pathIdx = ni; }
          else { en.x += dx/dist*s; en.y += dy/dist*s; }
          if (en.slowed > 0) en.slowed--;
        });

        units.forEach(u => {
          if (u.cd > 0) { u.cd--; return; }
          const target = enemies.find(e => Math.hypot(e.x-u.cx, e.y-u.cy) < u.radius);
          if (target) {
            u.cd = u.rate;
            const dmg = u.baseDamage * emul(u.rarity);
            bullets.push({ x: u.cx, y: u.cy, tx: target.x, ty: target.y, color: u.color, life: 6, dmg, target, special: u.special });
          }
        });

        bullets = bullets.filter(b => {
          b.life--;
          if (b.life <= 0) {
            if(b.target && enemies.includes(b.target)) {
              b.target.hp -= b.dmg;
              if(b.special === 'slow') b.target.slowed = 120;
              if(b.special === 'splash') enemies.forEach(e => { if(Math.hypot(e.x-b.tx, e.y-b.ty) < 40) e.hp -= b.dmg*0.5; });
              if(b.special === 'chain') {
                let count = 0;
                enemies.forEach(e => { if(e !== b.target && Math.hypot(e.x-b.tx, e.y-b.ty) < 60 && count < 2) { e.hp -= b.dmg; count++; }});
              }
              for(let i=0; i<3; i++) particles.push({x:b.tx, y:b.ty, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:15, color:b.color});
            }
            return false;
          }
          return true;
        });

        enemies.forEach(e => { if(e.hp <= 0 && !e.dead) { e.dead=true; coins += e.reward; score += e.reward*2; } });
        enemies = enemies.filter(e => !e.dead);
        particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; });
        particles = particles.filter(p => p.life > 0);

        if (enemies.length >= 100) {
          gameOver = true;
          $('mo').style.display = 'block';
          $('mo').innerHTML = `💀 OVERFLOW!<br>Wave: ${wave}<br>Score: ${score}<br><small>TAP TO RESTART</small>`;
          $('mo').onclick = () => location.reload();
        }

        updateUI(); draw();
        requestAnimationFrame(loop);
      }

      function draw() {
        ctx.fillStyle = '#1c1917'; ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle = '#0c0a09'; ctx.fillRect(GX1, GY1, GW, GH);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        for(let i=0; i<=SCOLS; i++) { ctx.beginPath(); ctx.moveTo(GX1+i*SW_, GY1); ctx.lineTo(GX1+i*SW_, GY2); ctx.stroke(); }
        for(let i=0; i<=SROWS; i++) { ctx.beginPath(); ctx.moveTo(GX1, GY1+i*SH_); ctx.lineTo(GX2, GY1+i*SH_); ctx.stroke(); }
        
        enemies.forEach(e => {
          ctx.font = '20px Arial'; ctx.textAlign='center'; ctx.fillText('👾', e.x, e.y+7);
          ctx.fillStyle = '#444'; ctx.fillRect(e.x-10, e.y-15, 20, 3);
          ctx.fillStyle = '#10b981'; ctx.fillRect(e.x-10, e.y-15, 20*(e.hp/e.maxHp), 3);
        });

        units.forEach(u => {
          ctx.beginPath(); ctx.arc(u.cx, u.cy, 13, 0, Math.PI*2);
          ctx.fillStyle = '#1e293b'; ctx.fill();
          ctx.strokeStyle = RRC[u.rarity]; ctx.lineWidth = 2; ctx.stroke();
          ctx.font = '16px Arial'; ctx.textAlign='center'; ctx.fillText(u.icon, u.cx, u.cy+6);
          if(u.stack > 1) { ctx.font='bold 10px sans-serif'; ctx.fillStyle='#fbbf24'; ctx.fillText('x'+u.stack, u.cx+12, u.cy-8); }
        });

        bullets.forEach(b => {
          ctx.beginPath(); ctx.arc(b.x+(b.tx-b.x)*(1-b.life/6), b.y+(b.ty-b.y)*(1-b.life/6), 3, 0, Math.PI*2);
          ctx.fillStyle = b.color; ctx.fill();
        });

        particles.forEach(p => { ctx.globalAlpha = p.life/15; ctx.fillStyle=p.color; ctx.fillRect(p.x, p.y, 2, 2); });
        ctx.globalAlpha = 1;
      }

      loop();
    })();
  </script>
</body>
</html>
